name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Manifests parse as JSON
        run: |
          python -c "import json; [json.load(open(f)) for f in ('.claude-plugin/plugin.json', '.claude-plugin/marketplace.json')]"

      - name: Scripts compile and print --help
        run: |
          python -m py_compile skills/research-talk-slides/scripts/assemble.py skills/research-talk-slides/scripts/shot.py
          python skills/research-talk-slides/scripts/assemble.py --help > /dev/null
          python skills/research-talk-slides/scripts/shot.py --help > /dev/null

      - name: Install Playwright + Chromium (for shot.py --check)
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Tests (assemble.py fixtures + shot.py --check at 1280x720 and 1024x768)
        env:
          REQUIRE_PLAYWRIGHT: "1"
        run: python -m unittest discover -s tests -v
