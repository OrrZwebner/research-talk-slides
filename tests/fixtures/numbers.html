<!-- Fixture for body classes slide-numbers / progress. Reveal buckets per slide: 0, 2, 0, 1;
     slide 3 has data-nonum. Bar positions = (earlier steps + earlier slides + shown) / (3 + 4 - 1):
     slide 1: 0; slide 2: 1/6, 2/6, 3/6; slide 3: 4/6; slide 4: 5/6, 6/6.
     Numbers: none on slide 1 (title), "2", none on slide 3 (data-nonum), "4". -->
<section class="slide nb1" data-section="Title" data-title="Title"><h1 class="title">Title</h1></section>
<section class="slide nb2" data-section="1" data-title="Two steps"><h2 class="title">Two</h2>
  <p class="step">a</p><p class="step">b</p></section>
<section class="slide nb3" data-section="1" data-title="Detail" data-nonum><h2 class="title">Detail</h2></section>
<section class="slide nb4" data-section="2" data-title="Last"><h2 class="title">Last</h2><p class="step">c</p></section>
