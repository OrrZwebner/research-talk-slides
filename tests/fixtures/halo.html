<!-- Fixture for .halo: an SVG <text class="halo"> (stroke outline, paint-order stroke first) and an
     HTML <span class="halo"> (text-shadow), next to plain controls without the class. -->
<section class="slide hl" data-section="1" data-title="Halo"><h2 class="title">Halo</h2>
  <svg width="400" height="100"><text class="halo" x="10" y="50">svg halo</text><text class="plain" x="10" y="90">plain</text></svg>
  <span class="halo">html halo</span> <span class="plain">plain</span>
</section>
