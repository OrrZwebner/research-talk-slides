<!-- Fixture for the kit's click guard: slide 1 has two reveal steps and a selectable paragraph
     (.cg .para, canvas y 200-260); slide 2 has none. A plain click advances one step; a drag, a
     double-click on a word and a shift-click that extends a selection leave the step unchanged. -->
<section class="slide cg" data-section="1" data-title="Guard">
  <h2 class="title">Click guard</h2>
  <style>.cg .para{position:absolute;left:100px;top:200px;width:900px;font-size:28px;line-height:60px}</style>
  <p class="para">Selectable words for the double click test</p>
  <p class="step">one</p><p class="step">two</p>
</section>
<section class="slide cg2" data-section="1" data-title="Second"><h2 class="title">Second</h2></section>
